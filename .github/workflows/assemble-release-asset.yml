name: Assemble verified LPL release asset
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'CHO-CYQ/rift-music'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reassemble and verify the uploaded music pack
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/421575941/assets?per_page=100" > assets.json
          python3 - <<'PY'
          import json, subprocess, hashlib, os, urllib.request
          assets=json.load(open('assets.json'))
          names=['rift-lpl-stage-001.bin','rift-lpl-stage-002.bin']
          found={a['name']:a for a in assets}
          expected=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/contents/docs/music-packs-v01.json",'-H','Accept: application/vnd.github.raw+json']))
          pack=next(p for p in expected if p['Id']=='bp-lpl')
          for name in names:
              a=found[name]
              assert a['state']=='uploaded'
              with open(name,'wb') as output:
                  subprocess.run(['gh','api','-H','Accept: application/octet-stream',f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/assets/{a['id']}"],stdout=output,check=True)
          with open(pack['Asset'],'wb') as output:
              for name in names:
                  with open(name,'rb') as source:
                      while block:=source.read(1024*1024):output.write(block)
          assert os.path.getsize(pack['Asset'])==pack['Bytes']
          with open(pack['Asset'],'rb') as source:assert hashlib.file_digest(source,'sha256').hexdigest()==pack['Sha256']
          verified=found.get(pack['Asset'])
          if verified and verified['state']=='starter' and verified.get('digest') is None:
              subprocess.run(['gh','api','--method','DELETE',f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/assets/{verified['id']}"],check=True)
              verified=None
          if verified is None:
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, *args, **kwargs): return None
              with open(pack['Asset'],'rb') as body:
                  upload=urllib.request.Request(f"https://uploads.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/releases/421575941/assets?name={pack['Asset']}",data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/octet-stream','Content-Length':str(pack['Bytes']),'User-Agent':'RiftMusic-release'})
                  with urllib.request.build_opener(NoRedirect).open(upload,timeout=120) as response: verified=json.load(response)
          print(json.dumps({key:verified.get(key) for key in ('id','name','state','size','digest')}))
          assert verified['state']=='uploaded' and verified['size']==pack['Bytes'] and verified['digest']=='sha256:'+pack['Sha256'], 'Final upload response does not match verified source'
          for name in names:
              subprocess.run(['gh','api','--method','DELETE',f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/assets/{found[name]['id']}"],check=True)
          abandoned=found.get('RiftMusic-Music-bp-lpl-v0.1-transfer.zip')
          if abandoned and abandoned['state']=='starter' and abandoned.get('digest') is None:
              subprocess.run(['gh','api','--method','DELETE',f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/assets/{abandoned['id']}"],check=True)
          print('Verified final LPL asset and removed temporary fragments.')
          PY
